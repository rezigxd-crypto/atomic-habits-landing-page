<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Habits — Free PDF Download</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg-primary:#0a0a0f;--bg-secondary:#111118;--bg-card:#16161f;--bg-card-hover:#1c1c28;
            --border-subtle:rgba(255,255,255,0.06);--border-medium:rgba(255,255,255,0.1);--border-gold:rgba(212,175,55,0.3);
            --text-primary:#f1f1f3;--text-secondary:#a0a0b0;--text-muted:#6b6b7b;
            --gold:#d4af37;--gold-light:#e8c84a;--gold-dark:#b8941f;--gold-glow:rgba(212,175,55,0.35);
            --accent-red:#e74c3c;--accent-red-glow:rgba(231,76,60,0.4);--accent-green:#2ecc71;
            --cta-gradient:linear-gradient(135deg,#d4af37 0%,#f0d060 50%,#b8941f 100%);
            --cta-gradient-hover:linear-gradient(135deg,#e8c84a 0%,#f7dd7a 50%,#d4af37 100%);
            --font-heading:'Playfair Display',Georgia,serif;
            --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            --shadow-card:0 4px 32px rgba(0,0,0,0.4);--shadow-gold:0 0 40px rgba(212,175,55,0.15);
            --shadow-cta:0 8px 32px rgba(212,175,55,0.3);
            --radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-xl:28px;
            --transition-fast:0.2s cubic-bezier(0.4,0,0.2,1);
            --transition-smooth:0.35s cubic-bezier(0.4,0,0.2,1);
            --transition-bounce:0.5s cubic-bezier(0.34,1.56,0.64,1);
        }
        html{scroll-behavior:smooth}
        body{
            font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);
            min-height:100vh;overflow-x:hidden;line-height:1.6;
            -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
        }
    </style>
</head>
